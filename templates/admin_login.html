<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administrator Login | Pascal Dishes</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #142b24;
            color: #26332d;
        }

        .login-card {
            max-width: 430px;
            margin: 55px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px #0003;
        }

        h1 {
            color: #142b24;
            margin-top: 0;
        }

        p {
            line-height: 1.6;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 24px;
            background: #d6a63b;
            color: #142b24;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        a {
            color: #087f5b;
        }

        .message {
            background: #fff0e8;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <p><a href="/">← Back to restaurant</a></p>

        <h1>Administrator Login</h1>
        <p>Sign in to manage customer orders.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('admin_login') }}">
            <input type="hidden" name="csrf_token"
                   value="{{ csrf_token() }}">

            <label for="email">Administrator Email</label>
            <input id="email" name="email" type="email"
                   autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   autocomplete="current-password" required>

            <button type="submit">Log In to Admin</button>
        </form>
    </div>
</body>
</html>
