
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account | Pascal Dishes</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #fffaf3;
            color: #29231e;
            margin: 0;
            padding: 25px 15px;
        }
        .card {
            max-width: 430px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 18px #00000012;
        }
        h1 { margin-top: 0; }
        .sub { color: #6c6259; line-height: 1.5; }
        label { display: block; margin-top: 16px; font-weight: bold; }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #f2b84b;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        a { color: #80502c; }
        .message { padding: 10px; border-radius: 5px; background: #fff0e8; margin: 8px 0; }
        .back { display: inline-block; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <a class="back" href="/">← Back to restaurant</a>
        <h1>Create your account</h1>
        <p class="sub">Register to prepare for online ordering at Pascal Dishes Restaurant.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="full_name">Full name</label>
            <input id="full_name" name="full_name" type="text"
                   maxlength="100" autocomplete="name" required>

            <label for="email">Email address</label>
            <input id="email" name="email" type="email"
                   maxlength="120" autocomplete="email" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   minlength="8" autocomplete="new-password" required>

            <label for="confirm_password">Confirm password</label>
            <input id="confirm_password" name="confirm_password" type="password"
                   minlength="8" autocomplete="new-password" required>

            <button type="submit">Create Account</button>
        </form>

        <p>Already registered? <a href="/login">Log in here</a>.</p>
    </div>
</body>
</html>
