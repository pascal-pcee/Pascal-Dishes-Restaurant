<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Customer Login | Pascal Dishes</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fffaf3;
            color: #29231e;
            margin: 0;
            padding: 25px 15px;
        }

        .card {
            max-width: 430px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 18px #00000012;
        }

        h1 {
            margin-top: 0;
        }

        p {
            line-height: 1.6;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #f2b84b;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        a {
            color: #80502c;
        }

        .message {
            padding: 10px;
            border-radius: 5px;
            background: #fff0e8;
            margin: 8px 0;
        }
    </style>
</head>

<body>
    <div class="card">

        <p><a href="/">← Back to restaurant</a></p>

        <h1>Customer Login</h1>
        <p>Log in to your Pascal Dishes account.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">

            <input type="hidden" name="csrf_token"
                   value="{{ csrf_token() }}">

            <label for="email">Email address</label>
            <input id="email" name="email" type="email"
                   autocomplete="email" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   autocomplete="current-password" required>

            <button type="submit">Log In</button>

        </form>

        <p>
            Don't have an account?
            <a href="{{ url_for('register') }}">Create one</a>.
        </p>

    </div>
</body>
</html>
